<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>FIRDAUSANTH</title><link rel="stylesheet" href="style.css"></head><body>
<header id="bar">
<div class="top"><h1><span data-i18n="t1"></span><small data-i18n="t2"></small></h1>
<button id="info" type="button" data-i18n-aria="info">ℹ</button>
<button id="lang" type="button" lang="en">English</button></div>
<div id="sw"><form id="sf" role="search">
<input id="q" inputmode="numeric" autocomplete="off" dir="ltr" data-i18n-ph="ph" data-i18n-aria="ph">
<button id="cl" type="button" hidden data-i18n-aria="clear">×</button>
<button type="submit" data-i18n-aria="go">🔍</button></form>
<p id="msg" role="status"></p></div></header>
<main id="feed"></main>
<dialog id="dlg"><div id="dc"></div><button id="dx" type="button" data-i18n="close"></button></dialog>
<script src="script.js"></script></body></html>
